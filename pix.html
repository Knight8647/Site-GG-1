<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento via Pix</title>
    <link rel="icon" href="assets/17042027.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <h1>Pagamento via Pix</h1>
    <p>Finalize seu presente</p>
  </header>

  <main class="pix-page">

    <!-- RESUMO -->
    <section class="pix-resumo" id="resumoPix">
      <!-- JS renderiza aqui -->
    </section>

    <!-- PIX -->
    <aside class="pix-aside">
      <div class="pix-card">

        <div id="qrcode"></div>

        <p class="pix-label">Chave Pix</p>

        <p class="pix-chave" id="pixKey">
        </p>

        <button class="btn outline btn-copy" onclick="copiarPix()">
          Copiar chave Pix
        </button>
        <div class="login-box">
          <label for="nomeConvidado">Seu nome</label>
          <input
            type="text"
            id="nomeConvidado"
            placeholder="Ex: Gui e Gabi"
            >
          </div>
        <button class="btn btn-pix" onclick="abrirModal()">
          Já fiz o pagamento
        </button>

        <div class="mensagem-box">
          <textarea id="mensagemNoivos"
            placeholder="Deixe uma mensagem para os noivos 💙"></textarea>
        </div>

      </div>
    </aside>

  </main>

  <!-- MODAL -->
  <div class="modal" id="confirmModal">
    <div class="modal-box">
      <h2>Pagamento confirmado?</h2>
      <p>Após confirmar, os presentes serão marcados como presenteados!</p>

      <div class="modal-actions">
        <button class="btn outline" onclick="fecharModal()">Cancelar</button>
        <button class="btn" onclick="finalizarPagamento()">Confirmar</button>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="js/carrinho-core.js"></script>
<script src="js/pix-protect.js"></script>
<script src="js/pix.js"></script>

</body>
</html>
