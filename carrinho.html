<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Carrinho - Lista de Casamento</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <h1>Seu Carrinho</h1>
    <p>Confira os presentes selecionados</p>
  </header>

<main class="carrinho-page">

  <!-- LISTA DE ITENS -->
  <section class="carrinho-lista">
    <h2>Seu carrinho</h2>
    <p class="subtitulo">Confira os presentes selecionados</p>

    <div id="listaCarrinho"></div>
  </section>

  <!-- RESUMO / PAGAMENTO -->
  <aside class="carrinho-resumo">
    <h3>Resumo</h3>

    <div class="resumo-linha">
      <span>Total</span>
      <strong>R$ <span id="totalCarrinho">0</span></strong>
    </div>

    <button class="btn btn-pix" onclick="irParaPagamentoPix()">
      Finalizar compra via Pix
    </button>
  </aside>

</main>

<script src="js/carrinho-core.js"></script>
<script src="js/carrinho.js"></script>


</body>
</html>
